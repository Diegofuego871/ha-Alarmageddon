name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

# Die Tests brauchen nur Lesezugriff auf den Code (das Token bekommt keine Schreibrechte).
permissions:
  contents: read

jobs:
  python:
    name: Python (Home Assistant)
    runs-on: ubuntu-latest
    # Ein Lauf dauert etwa 2 Minuten; hängt er, soll er nicht 6 Stunden Laufzeit verbrauchen
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Abhängigkeiten
        # Die Kamera-Komponente (Abhängigkeit der HomeKit-Bridge) meldet ohne libturbojpeg nur eine Warnung; nicht nötig
        run: pip install -r requirements_test.txt

      - name: Pyflakes
        run: python -m pyflakes custom_components/alarmageddon/*.py tests/*.py

      - name: Tests
        run: python -m pytest -q
