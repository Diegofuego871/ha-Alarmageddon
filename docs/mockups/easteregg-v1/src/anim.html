<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Easter Egg Mockup</title>
<style>
:root{--bg:#111214;--card:#1c1d20;--fg:#e8e8ea;--t2:#9a9aa2;--o1:#ffb45e;--o2:#ff6a3d;--o3:#e5304a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;height:100vh;overflow:hidden}
.bar{height:60px;display:flex;align-items:center;gap:20px;padding:0 20px;border-bottom:1px solid #2a2b2f}
.head{display:flex;align-items:center;gap:14px;padding:16px 20px}
.head h1{margin:0;font-size:30px}
.logo{width:40px;height:40px;cursor:pointer}
.card{margin:12px 20px;height:150px;border-radius:24px;background:var(--card)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.72);opacity:0;pointer-events:none}
.pop{position:fixed;left:50%;top:50%;width:min(340px,86vw);margin:0;padding:26px 22px 22px;border-radius:28px;background:#17181b;border:1px solid #2e2f34;text-align:center;overflow:hidden;opacity:0;transform-origin:center}
.stage{position:relative;width:200px;height:200px;margin:0 auto 10px;perspective:700px}
.beam{position:absolute;left:50%;top:50%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(255,150,60,.0) 0deg,rgba(255,120,50,.55) 18deg,rgba(255,106,61,0) 44deg,transparent 180deg,rgba(255,120,50,.55) 198deg,rgba(255,106,61,0) 224deg,transparent 360deg);
  -webkit-mask:radial-gradient(circle,#000 18%,transparent 68%);mask:radial-gradient(circle,#000 18%,transparent 68%);mix-blend-mode:screen}
.glow{position:absolute;left:50%;top:46%;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,120,.95),rgba(255,106,61,.5) 45%,transparent 70%)}
.logo3d{position:absolute;inset:0;transform-style:preserve-3d}
.logo3d svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 14px rgba(255,106,61,.55))}
.pop h2{margin:6px 0 2px;font-size:26px}.pop .v{color:var(--o1);font-weight:700;font-size:18px}
.pop p{color:var(--t2);font-size:14px;margin:10px 0 0}.pop a{color:#7ab7ff;text-decoration:none}
.pop .x{margin-top:18px;display:inline-block;padding:10px 26px;border-radius:999px;background:#26272b;color:var(--fg)}
/* Variante A: Schild dreht sich um die senkrechte Achse, Lichtkegel kreist, A pulsiert */
.A .logo3d{animation:spinY 4s linear infinite}
.A .beam{animation:spinZ 2.4s linear infinite}
.A .glow{animation:pulse 1.2s ease-in-out infinite}
/* Variante B: Schild steht, A ist die Lampe: zwei Lichtkegel kreisen, Hintergrund blitzt rot */
.B .logo3d{animation:float 3s ease-in-out infinite}
.B .beam{animation:spinZ 1.6s linear infinite}
.B .glow{animation:pulse .8s ease-in-out infinite}
.B .pop::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(229,48,74,.35),transparent 60%);animation:flash 1.6s ease-in-out infinite}
@keyframes spinY{to{transform:rotateY(360deg)}}
@keyframes spinZ{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.35);opacity:.7}}
@keyframes float{50%{transform:translateY(-6px) scale(1.03)}}
@keyframes flash{50%{opacity:.25}}
</style>
<body class="A">
<div class="bar">☰ Alarmageddon</div>
<div class="head"><svg class="logo" id="logo" viewBox="22 22 212 212"><use href="#shield"/></svg><h1>Lettenstrasse</h1></div>
<div class="card"></div><div class="card"></div>
<div class="scrim" id="scrim"></div>
<div class="pop" id="pop">
  <div class="stage"><div class="beam"></div><div class="glow"></div><div class="logo3d"><svg viewBox="22 22 212 212"><use href="#shield"/></svg></div></div>
  <h2>Alarmageddon</h2><div class="v">Version 1.19.0</div>
  <p><a>github.com/Diegofuego871/ha-alarmageddon</a></p><span class="x">Schliessen</span>
</div>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="g" x1="40" y1="24" x2="216" y2="232" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFB45E"/><stop offset=".5" stop-color="#FF6A3D"/><stop offset="1" stop-color="#E5304A"/></linearGradient>
<g id="shield"><path d="M128 36 L204 64 V122 C204 170 172 204 128 222 C84 204 52 170 52 122 V64 Z" fill="none" stroke="url(#g)" stroke-width="22" stroke-linejoin="round"/><path d="M94 164 L128 92 L162 164" fill="none" stroke="url(#g)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M110 138 H146" fill="none" stroke="url(#g)" stroke-width="16" stroke-linecap="round"/></g></defs></svg>
<script>
const q=new URLSearchParams(location.search);document.body.className=q.get("v")||"A";
const logo=document.getElementById("logo"),pop=document.getElementById("pop"),scrim=document.getElementById("scrim");
// Zoom aus der Lage des kleinen Logos in die Mitte (FLIP), 700 ms
window.open_=()=>{const a=logo.getBoundingClientRect(),b=pop.getBoundingClientRect();
 const dx=a.left+a.width/2-(b.left+b.width/2),dy=a.top+a.height/2-(b.top+b.height/2),s=a.width/b.width;
 pop.style.transform="translate(-50%,-50%)";
 const z=pop.animate([{opacity:0,transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(${s}) rotate(-200deg)`},{opacity:1,offset:.25},{opacity:1,transform:"translate(-50%,-50%) scale(1) rotate(0)"}],{duration:700,easing:"cubic-bezier(.2,.9,.25,1.1)",fill:"forwards"});
 scrim.animate([{opacity:0},{opacity:1}],{duration:500,fill:"forwards"});return z;};
let n=0,t;logo.addEventListener("click",()=>{clearTimeout(t);if(++n>=3){n=0;open_();}else t=setTimeout(()=>n=0,600);});
</script></body></html>
